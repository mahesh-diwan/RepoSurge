name: Daily Fetch

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force fetch even if already run today"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Verify GITHUB_TOKEN is set
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is not configured"
            exit 1
          fi
        shell: bash

      - name: Check if already fetched today
        if: github.event.inputs.force != 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST_FETCH=$(git log -1 --format=%ci -- data/repos.json 2>/dev/null | cut -d' ' -f1)
          if [ "$LAST_FETCH" = "$TODAY" ]; then
            echo "Already fetched today ($TODAY). Use force=true to override."
            exit 0
          fi
        shell: bash

      - name: Fetch repos
        run: npx tsx scripts/fetch-repos.ts
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if data changed
        run: |
          if git diff --quiet data/repos.json; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, will commit"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        id: check
        shell: bash

      - name: Commit database
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "chore: daily star snapshot $(date -u +%Y-%m-%d)"
          git push
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo "## Daily Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Repos: $(cat data/repos.json | jq '.repos | length' 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- Changed: ${{ steps.check.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
